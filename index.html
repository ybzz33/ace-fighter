<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>毅博老师 · 飞机大战</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden; background:#02030a; font-family:"Microsoft YaHei","PingFang SC",sans-serif; }
#wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:radial-gradient(1200px 700px at 50% 30%, #0b1030 0%, #03040c 60%, #01020a 100%); }
#gameCanvas { background:#000; box-shadow:0 0 60px rgba(60,120,255,.35), 0 0 120px rgba(120,60,255,.15); border-radius:8px; cursor:crosshair; touch-action:none; }
#hint { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); color:#6a7bb8; font-size:12px; letter-spacing:1px; text-align:center; line-height:1.8; pointer-events:none; text-shadow:0 0 8px rgba(0,0,0,.8); }
#invincible-hud {
  position:fixed; top:14px; left:50%; transform:translateX(-50%);
  background:linear-gradient(135deg,#ffd700,#ffaa00);
  color:#000; font-size:15px; font-weight:bold;
  padding:8px 22px; border-radius:20px;
  box-shadow:0 0 20px rgba(255,215,0,0.6);
  display:none; pointer-events:none; z-index:20;
  animation:invPulse 1s infinite;
}
#invincible-hud.visible { display:block; }
@keyframes invPulse {
  0%,100% { opacity:1; transform:translateX(-50%) scale(1); }
  50% { opacity:0.85; transform:translateX(-50%) scale(1.06); }
}
#controls { position:fixed; inset:0; pointer-events:none; z-index:5; display:none; }
#joy-base { position:fixed; left:26px; bottom:36px; width:130px; height:130px; border-radius:50%; background:rgba(20,40,90,0.28); border:2px solid rgba(140,190,255,0.45); pointer-events:auto; }
#joy-knob { position:absolute; left:50%; top:50%; width:54px; height:54px; margin:-27px 0 0 -27px; border-radius:50%; background:rgba(120,200,255,0.55); box-shadow:0 0 14px rgba(120,200,255,.7); }
#fire-btn { position:fixed; right:24px; bottom:150px; width:96px; height:96px; border-radius:50%; background:rgba(255,110,70,0.30); border:2px solid rgba(255,170,130,0.75); color:#fff; font-weight:bold; font-size:17px; font-family:"Microsoft YaHei",sans-serif; display:flex; align-items:center; justify-content:center; pointer-events:auto; user-select:none; -webkit-user-select:none; }
#skill-btns { position:fixed; right:14px; bottom:34px; display:flex; gap:10px; pointer-events:auto; }
.sk { width:58px; height:58px; border-radius:10px; border:2px solid rgba(120,180,255,0.55); background:rgba(20,30,70,0.80); color:#cfe3ff; font-size:11px; font-family:"Microsoft YaHei",sans-serif; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:2px; user-select:none; -webkit-user-select:none; }
.sk b { font-size:18px; }
@media (pointer:coarse), (hover:none) { #controls { display:block; } #hint { display:none; } }
@media (max-width:640px){ #hint{ font-size:10px; } }
#leaderboard-panel, #feedback-panel, #admin-panel, #name-panel {
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  width:340px; background:rgba(8,12,36,0.95); backdrop-filter:blur(12px);
  border:1px solid rgba(100,160,255,0.25); border-radius:16px;
  padding:24px 28px; z-index:30; display:none;
  box-shadow:0 0 40px rgba(60,120,255,0.2);
}
#leaderboard-panel.visible, #feedback-panel.visible, #admin-panel.visible, #name-panel.visible { display:block; }
#leaderboard-panel h3, #feedback-panel h3, #admin-panel h3 {
  text-align:center; color:#ffd166; font-size:20px; margin-bottom:16px;
  text-shadow:0 0 12px rgba(255,209,102,0.4);
}
.lb-tabs { display:flex; gap:8px; margin-bottom:14px; }
.lb-tab {
  flex:1; padding:7px 0; text-align:center; border-radius:8px;
  background:rgba(255,255,255,0.06); color:#8fa3d9; font-size:13px;
  cursor:pointer; border:1px solid rgba(255,255,255,0.1); transition:all 0.2s;
}
.lb-tab.active { background:rgba(100,160,255,0.2); color:#fff; border-color:rgba(100,160,255,0.5); }
.lb-list { list-style:none; padding:0; margin:0; }
.lb-item {
  display:flex; align-items:center; padding:8px 10px; margin-bottom:4px;
  border-radius:8px; background:rgba(255,255,255,0.03); font-size:14px; color:#cfe3ff;
}
.lb-item .rank { width:28px; font-weight:bold; color:#ffd166; font-size:15px; }
.lb-item .rank.r1 { color:#ffd700; font-size:17px; }
.lb-item .rank.r2 { color:#c0c0c0; }
.lb-item .rank.r3 { color:#cd7f32; }
.lb-item .lb-score { flex:1; text-align:right; font-weight:bold; color:#fff; font-size:16px; }
.lb-item .lb-wave { color:#8fa3d9; font-size:12px; margin-left:10px; }
.lb-empty { text-align:center; color:#5a6a95; font-size:13px; padding:20px 0; }
.lb-close, .fb-close, .admin-close {
  display:block; margin:16px auto 0; padding:8px 28px; border-radius:8px;
  background:rgba(100,160,255,0.2); color:#cfe3ff; border:1px solid rgba(100,160,255,0.4);
  font-size:14px; cursor:pointer; font-family:"Microsoft YaHei",sans-serif;
}
.lb-close:hover, .fb-close:hover, .admin-close:hover { background:rgba(100,160,255,0.35); }
#name-input {
  width:100%; padding:10px 14px; border-radius:8px; border:1px solid rgba(100,160,255,0.4);
  background:rgba(20,30,70,0.6); color:#fff; font-size:16px; font-family:"Microsoft YaHei",sans-serif;
  margin-bottom:14px; outline:none;
}
#name-input:focus { border-color:rgba(100,180,255,0.8); }
#name-submit {
  display:block; width:100%; padding:10px; border-radius:8px;
  background:linear-gradient(135deg,#4fc3f7,#1565c0); color:#fff; border:none;
  font-size:16px; font-weight:bold; cursor:pointer; font-family:"Microsoft YaHei",sans-serif;
}
#name-submit:hover { background:linear-gradient(135deg,#6dd5ff,#1976d2); }
#fb-textarea {
  width:100%; height:100px; padding:10px; border-radius:8px; border:1px solid rgba(100,160,255,0.4);
  background:rgba(20,30,70,0.6); color:#fff; font-size:14px; font-family:"Microsoft YaHei",sans-serif;
  resize:none; outline:none; margin-bottom:10px;
}
#fb-textarea:focus { border-color:rgba(100,180,255,0.8); }
#fb-submit {
  display:block; width:100%; padding:10px; border-radius:8px;
  background:linear-gradient(135deg,#69f0ae,#2e7d32); color:#fff; border:none;
  font-size:15px; font-weight:bold; cursor:pointer; font-family:"Microsoft YaHei",sans-serif;
}
#fb-submit:hover { background:linear-gradient(135deg,#81f7c0,#388e3c); }
.fb-success { text-align:center; color:#69f0ae; font-size:14px; margin-top:10px; display:none; }
.admin-list { max-height:300px; overflow-y:auto; margin-bottom:10px; }
.admin-item { padding:8px; margin-bottom:6px; background:rgba(255,255,255,0.04); border-radius:6px; font-size:13px; color:#cfe3ff; }
.admin-item .fb-name { color:#ffd166; font-weight:bold; }
.admin-item .fb-time { color:#5a6a95; font-size:11px; }
.admin-item .fb-text { margin-top:4px; color:#fff; }
.admin-export {
  display:block; width:100%; padding:8px; border-radius:8px;
  background:rgba(255,200,60,0.2); color:#ffd166; border:1px solid rgba(255,200,60,0.4);
  font-size:13px; cursor:pointer; font-family:"Microsoft YaHei",sans-serif; margin-top:8px;
}
</style>
</head>
<body>
<div id="wrap"><canvas id="gameCanvas"></canvas></div>
<div id="invincible-hud">️ 无敌模式</div>
<div id="name-panel">
  <h3> 请输入你的名字</h3>
  <input type="text" id="name-input" placeholder="玩家昵称" maxlength="12" autocomplete="off">
  <button id="name-submit">确认开始</button>
</div>
<div id="leaderboard-panel">
  <h3> 排行榜</h3>
  <div class="lb-tabs">
    <div class="lb-tab active" data-mode="normal">普通模式</div>
    <div class="lb-tab" data-mode="invincible">无敌模式</div>
  </div>
  <ul class="lb-list" id="lb-list"></ul>
  <button class="lb-close" id="lb-close">关闭</button>
</div>
<div id="feedback-panel">
  <h3> 游戏反馈</h3>
  <textarea id="fb-textarea" placeholder="写下你的建议或想法..."></textarea>
  <button id="fb-submit">提交反馈</button>
  <div class="fb-success" id="fb-success">感谢你的反馈！</div>
  <button class="fb-close" id="fb-close">关闭</button>
</div>
<div id="admin-panel">
  <h3> 反馈管理</h3>
  <div class="admin-list" id="admin-list"></div>
  <button class="admin-export" id="admin-export">导出 JSON</button>
  <button class="admin-close" id="admin-close">关闭</button>
</div>
<div id="hint">
移动: 方向键 / WASD / 鼠标 · 射击: 空格(可按住) 或 鼠标左键<br>
技能: 1=护盾 2=歼灭 3=火力 4=回血 · P 暂停 · M 静音 · Esc 返回菜单
</div>
<div id="controls">
<div id="joy-base"><div id="joy-knob"></div></div>
<div id="fire-btn">射击</div>
<div id="skill-btns">
<div class="sk" data-skill="0"><b>1</b>护盾</div>
<div class="sk" data-skill="1"><b>2</b>歼灭</div>
<div class="sk" data-skill="2"><b>3</b>火力</div>
<div class="sk" data-skill="3"><b>4</b>回血</div>
</div>
</div>
<script>
"use strict";
const W = 480, H = 720;
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = W; canvas.height = H;
const DPR = Math.min(window.devicePixelRatio || 1, 2);
const fitCanvas = () => {
    const scale = Math.min((window.innerWidth * 0.94) / W, (window.innerHeight * 0.88) / H);
    canvas.style.width = (W * scale) + 'px'; canvas.style.height = (H * scale) + 'px';
};
window.addEventListener('resize', fitCanvas); fitCanvas();

const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

const Audio = (() => {
    let ctx = null, master = null, bgmTimer = null, bgmStep = 0, muted = false;
    function ensure() {
        if (!ctx) { ctx = new (window.AudioContext || window.webkitAudioContext)(); master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination); }
        if (ctx.state === 'suspended') ctx.resume();
    }
    function tone(freq, dur, type, vol, slideTo, delay) {
        if (!ctx || muted) return;
        const t0 = ctx.currentTime + (delay || 0);
        const o = ctx.createOscillator(); const g = ctx.createGain();
        o.type = type || 'square'; o.frequency.setValueAtTime(freq, t0);
        if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
        g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.02);
    }
    function noise(dur, vol, filterFreq, delay) {
        if (!ctx || muted) return;
        const t0 = ctx.currentTime + (delay || 0);
        const len = Math.floor(ctx.sampleRate * dur);
        const buf = ctx.createBuffer(1, len, ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const src = ctx.createBufferSource(); src.buffer = buf;
        const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filterFreq || 1200;
        const g = ctx.createGain(); g.gain.setValueAtTime(vol || 0.3, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        src.connect(f); f.connect(g); g.connect(master); src.start(t0);
    }
    return {
        tone, noise, unlock() { ensure(); }, toggleMute() { muted = !muted; return muted; }, isMuted() { return muted; },
        shoot() { tone(660, 0.08, 'square', 0.10, 220); },
        shootBig() { tone(420, 0.12, 'sawtooth', 0.14, 150); },
        hit() { tone(320, 0.06, 'triangle', 0.12, 180); },
        explode() { noise(0.35, 0.32, 900); tone(140, 0.30, 'sawtooth', 0.18, 40); },
        bigExplode(){ noise(0.8, 0.5, 600); tone(90, 0.7, 'sawtooth', 0.30, 25); },
        playerHurt(){ tone(200, 0.25, 'sawtooth', 0.28, 60); noise(0.2, 0.2, 700); },
        playerDie(){ tone(300, 0.9, 'sawtooth', 0.35, 40); noise(1.0, 0.5, 500); },
        shield() { tone(240, 0.4, 'sine', 0.22, 720); tone(480, 0.5, 'sine', 0.16, 960, 0.08); },
        bomb() { tone(60, 0.9, 'sine', 0.45, 28); noise(0.7, 0.45, 400); },
        power() { [523,659,784,1046].forEach((f,i)=>tone(f,0.16,'square',0.14,undefined,i*0.06)); },
        heal() { [400,500,600,800].forEach((f,i)=>tone(f,0.12,'sine',0.12,undefined,i*0.08)); },
        levelup() { [523,659,784,1046,1318].forEach((f,i)=>tone(f,0.14,'triangle',0.15,undefined,i*0.07)); },
        bossRoar() { tone(70, 1.2, 'sawtooth', 0.32, 45); noise(0.5,0.2,300); tone(110,0.8,'square',0.16,55,0.15); },
        gameover() { [392,330,262,196].forEach((f,i)=>tone(f,0.4,'triangle',0.2,undefined,i*0.18)); },
        easterEgg() { [523,659,784,1046,1318,1568,2093].forEach((f,i)=>tone(f,0.2,'triangle',0.18,undefined,i*0.1)); },
        startBGM() {
            ensure(); if (bgmTimer) return;
            const bass = [55, 55, 65.4, 55, 49, 49, 58.3, 49];
            const arp = [220, 261.6, 329.6, 392, 329.6, 261.6, 220, 196];
            bgmStep = 0;
            bgmTimer = setInterval(() => {
                if (muted) return;
                const s = bgmStep % bass.length;
                tone(bass[s], 0.42, 'triangle', 0.10);
                if (s % 2 === 0) tone(arp[s], 0.30, 'sine', 0.05, undefined, 0.22);
                bgmStep++;
            }, 380);
        },
        stopBGM() { if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; } }
    };
})();

const Input = {
    keys: {}, mouseX: W/2, mouseY: H-120, usingMouse: false,
    shoot: false, prevShoot: false, keydown: {}, keyup: {},
    touch: { active:false, id:-1, sx:0, sy:0, dx:0, dy:0 }, tapStart: false,
};
window.addEventListener('keydown', e => { Input.keys[e.code] = true; Input.keydown[e.code] = true; if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Escape'].includes(e.code)) e.preventDefault(); });
window.addEventListener('keyup', e => { Input.keys[e.code] = false; Input.keyup[e.code] = true; });
canvas.addEventListener('mousemove', e => { const r = canvas.getBoundingClientRect(); Input.mouseX = (e.clientX - r.left) / r.width * W; Input.mouseY = (e.clientY - r.top) / r.height * H; Input.usingMouse = true; });
canvas.addEventListener('mousedown', e => { if (e.button === 0) { Input.shoot = true; Input.usingMouse = true; if (game.state === GS.MENU) handleMenuClick(e); } });
window.addEventListener('mouseup', e => { if (e.button === 0) Input.shoot = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

const $ = id => document.getElementById(id);
const joyBase = $('joy-base'), joyKnob = $('joy-knob');
const JOY_R = 42;
function canvasPos(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }

canvas.addEventListener('touchstart', e => {
    e.preventDefault(); Audio.ensure && Audio.ensure();
    const p = canvasPos(e.touches[0]);
    if (game.state === GS.MENU) {
        const mx = p.x, my = p.y;
        for (const btn of menuButtons) {
            if (mx >= btn.x && mx <= btn.x + btn.w && my >= btn.y && my <= btn.y + btn.h) {
                if (btn.action === 'leaderboard') showLeaderboard();
                else if (btn.action === 'feedback') showFeedback();
                else { gameMode = btn.action; startGame(btn.action); }
                return;
            }
        }
        Input.tapStart = true; return;
    }
    if (game.state === GS.OVER) { Input.tapStart = true; return; }
    if (game.state === GS.PLAY) { Input.shoot = true; Input.prevShoot = true; }
}, { passive:false });
canvas.addEventListener('touchend', e => { e.preventDefault(); Input.shoot = false; }, { passive:false });

joyBase.addEventListener('touchstart', e => { e.preventDefault(); const t = e.changedTouches[0]; Input.touch = { active:true, id:t.identifier, sx:t.clientX, sy:t.clientY, dx:0, dy:0 }; joyKnob.style.opacity = '1'; }, { passive:false });
joyBase.addEventListener('touchmove', e => { e.preventDefault(); const t = Array.from(e.touches).find(t => t.identifier === Input.touch.id); if (!t) return; let dx = t.clientX - Input.touch.sx, dy = t.clientY - Input.touch.sy; const d = Math.hypot(dx, dy); if (d > JOY_R) { dx = dx / d * JOY_R; dy = dy / d * JOY_R; } Input.touch.dx = dx / JOY_R; Input.touch.dy = dy / JOY_R; joyKnob.style.transform = `translate(${dx}px,${dy}px)`; }, { passive:false });
joyBase.addEventListener('touchend', e => { e.preventDefault(); Input.touch = { active:false, id:-1, sx:0, sy:0, dx:0, dy:0 }; joyKnob.style.transform = 'translate(0px,0px)'; joyKnob.style.opacity = '0.6'; }, { passive:false });
const resetJoy = () => { Input.touch = { active:false, id:-1, sx:0, sy:0, dx:0, dy:0 }; joyKnob.style.transform = 'translate(0px,0px)'; joyKnob.style.opacity = '0.6'; };
joyBase.addEventListener('touchcancel', resetJoy);
$('fire-btn').addEventListener('touchstart', e => { e.preventDefault(); Input.shoot = true; }, { passive:false });
$('fire-btn').addEventListener('touchend', e => { e.preventDefault(); Input.shoot = false; }, { passive:false });
$('fire-btn').addEventListener('touchcancel', e => { Input.shoot = false; });
document.querySelectorAll('.sk').forEach(btn => {
    const idx = parseInt(btn.dataset.skill, 10);
    const fire = e => { e.preventDefault(); Audio.ensure && Audio.ensure(); if (game.state === GS.PLAY) useSkill(idx); };
    btn.addEventListener('touchstart', fire, { passive:false });
});

const GS = { MENU:0, PLAY:1, PAUSE:2, OVER:3 };
const game = { state: GS.MENU, score: 0, best: 0, wave: 1, time: 0, shake: 0, spawnTimer: 0, combo: 0, comboMax: 0, kills: 0, flash: 0, flashColor: '255,255,255', bossDone: false };
const player = { x: W/2, y: H-130, w: 46, h: 50, hp: 100, maxHp: 100, fireCd: 0, invincible: 0, shieldT: 0, powerT: 0, skillCd: [0, 0, 0, 0], skillMaxCd: [12, 16, 15, 40], speed: 5.2, alive: true, flashT: 0 };
let bullets = [], enemies = [], ebullets = [], particles = [], stars = [], powerups = [], boss = null;
let invincibleMode = false, gameMode = 'normal', playerName = '玩家';
let leaderboard = { normal: [], invincible: [] };
let feedbackList = [];
const LB_KEY = 'acf_leaderboard', FB_KEY = 'acf_feedback', NAME_KEY = 'acf_name';
const LB_MAX = 10;

function loadLeaderboard() { try { const d = JSON.parse(localStorage.getItem(LB_KEY)); if (d && d.normal) leaderboard = d; } catch(e) {} }
function saveLeaderboard() { try { localStorage.setItem(LB_KEY, JSON.stringify(leaderboard)); } catch(e) {} }
function addScore(mode, score, wave) { const list = leaderboard[mode]; list.push({ score, wave, name: playerName, date: Date.now() }); list.sort((a, b) => b.score - a.score); if (list.length > LB_MAX) list.length = LB_MAX; saveLeaderboard(); }
function renderLeaderboard(mode) {
    const list = leaderboard[mode] || []; const ul = $('lb-list');
    if (list.length === 0) { ul.innerHTML = '<li class="lb-empty">暂无记录，快去挑战吧！</li>'; return; }
    ul.innerHTML = list.map((item, i) => {
        const rc = i === 0 ? 'r1' : (i === 1 ? 'r2' : (i === 2 ? 'r3' : ''));
        const medal = i === 0 ? '🥇' : (i === 1 ? '🥈' : (i === 2 ? '🥉' : (i+1)));
        return `<li class="lb-item"><span class="rank ${rc}">${medal}</span><span class="lb-score">${String(item.score).padStart(6,'0')}</span><span class="lb-wave">${item.name || '匿名'} · 波${item.wave}</span></li>`;
    }).join('');
}
function loadFeedback() { try { feedbackList = JSON.parse(localStorage.getItem(FB_KEY)) || []; } catch(e) { feedbackList = []; } }
function saveFeedback() { try { localStorage.setItem(FB_KEY, JSON.stringify(feedbackList)); } catch(e) {} }
function addFeedback(text) { feedbackList.push({ name: playerName, text, time: Date.now() }); saveFeedback(); }
function loadPlayerName() { try { const n = localStorage.getItem(NAME_KEY); if (n) playerName = n; } catch(e) {} }
function savePlayerName() { try { localStorage.setItem(NAME_KEY, playerName); } catch(e) {} }
loadLeaderboard(); loadFeedback(); loadPlayerName();

(function initStars(){ for (let i = 0; i < 130; i++) stars.push({ x: rand(0,W), y: rand(0,H), z: rand(0.3,1), s: rand(0.6,2.4), tw: rand(0,Math.PI*2) }); })();

function spawnParticles(x, y, n, colors, speed, life) { for (let i = 0; i < n; i++) { const a = rand(0, Math.PI*2), sp = rand(0.3, speed); particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: rand(0.3, life), max: life, size: rand(1.5, 4.5), color: colors[randi(0, colors.length-1)], drag: 0.96 }); } }
function spawnRing(x, y, color, n, speed, life) { for (let i = 0; i < n; i++) { const a = (i/n) * Math.PI * 2; particles.push({ x, y, vx: Math.cos(a)*speed, vy: Math.sin(a)*speed, life, max: life, size: rand(1.5,3), color, drag: 0.94 }); } }

function drawPlayer() {

    grad.addColorStop(0, '#eafcff'); grad.addColorStop(0.35, '#4fc3f7'); grad.addColorStop(1, '#1565c0');
    ctx.beginPath(); ctx.moveTo(0, -25); ctx.quadraticCurveTo(9, -6, 8, 10); ctx.quadraticCurveTo(14, 16, 22, 20);
    ctx.quadraticCurveTo(8, 15, 4, 13); ctx.quadraticCurveTo(2, 22, 0, 22); ctx.quadraticCurveTo(-2, 22, -4, 13);
    ctx.quadraticCurveTo(-8, 15, -22, 20); ctx.quadraticCurveTo(-14, 16, -8, 10); ctx.quadraticCurveTo(-9, -6, 0, -25);

    ctx.beginPath(); ctx.ellipse(0, -6, 4.5, 8, 0, 0, Math.PI*2); ctx.fillStyle = '#0b2a5c'; ctx.fill();

    if (invincibleMode) { const t = game.time; ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 3; ctx.globalAlpha = 0.7 + Math.sin(t * 8) * 0.3; ctx.beginPath(); ctx.arc(0, 0, 38, 0, Math.PI*2); ctx.stroke(); ctx.strokeStyle = '#ffaa00'; ctx.lineWidth = 2; ctx.globalAlpha = 0.5 + Math.sin(t * 12) * 0.3; ctx.beginPath(); ctx.arc(0, 0, 32, 0, Math.PI*2); ctx.stroke(); ctx.globalAlpha = 1; }
    if (p.powerT > 0) { ctx.globalAlpha = 0.35 + Math.sin(game.time*18)*0.15; ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI*2); ctx.fillStyle = '#ffab40'; ctx.fill(); ctx.globalAlpha = 1; }
    const hw = 42, hh = 4, bx = -hw/2, by = -42;

function playerShoot() {
    const p = player; const powered = p.powerT > 0; const cd = powered ? 0.075 : 0.13;
    if (p.fireCd > 0) return; p.fireCd = cd;
    const mk = (ox, vx) => bullets.push({ x: p.x + ox, y: p.y - 22, w: 6, h: 14, vx: vx || 0, vy: powered ? -14 : -11, dmg: powered ? 2 : 1, color: powered ? '#ffd166' : '#7df9ff', pierce: powered, dead: false });
    if (powered) { mk(-10, -1.6); mk(0, 0); mk(10, 1.6); mk(-4, 0); mk(4, 0); Audio.shootBig(); }
    else { mk(-8, 0); mk(8, 0); Audio.shoot(); }
}

function useSkill(i) {
    const p = player; if (p.skillCd[i] > 0) return; p.skillCd[i] = p.skillMaxCd[i];
    if (i === 0) { p.shieldT = 5; p.invincible = Math.max(p.invincible, 5); spawnRing(p.x, p.y, '#69f0ff', 36, 5, 0.7); Audio.shield(); }
    else if (i === 1) { game.flash = 0.5; game.flashColor = '255,240,180'; game.shake = Math.max(game.shake, 16); for (const e of enemies) { e.hp -= 40; spawnParticles(e.x, e.y, 12, ['#ffd166','#ff9f43','#fff'], 4, 0.6); } for (const b of ebullets) b.dead = true; if (boss) { boss.hp -= 60; spawnParticles(boss.x, boss.y, 20, ['#ff9f43','#ff5252','#fff'], 4, 0.7); } ebullets = ebullets.filter(b => !b.dead); spawnRing(W/2, H/2, '#ffd166', 48, 8, 0.8); Audio.bomb(); }
    else if (i === 2) { p.powerT = 8; Audio.power(); }
    else if (i === 3) { const healAmt = 30; p.hp = Math.min(p.maxHp, p.hp + healAmt); spawnParticles(p.x, p.y, 16, ['#69f0ae','#a5d6a7','#fff'], 3, 0.6); spawnRing(p.x, p.y, '#69f0ae', 20, 4, 0.5); Audio.heal(); showBanner('回血 +' + healAmt); }
}

function updatePlayer(dt) {
    const p = player; if (!p.alive) return;
    let dx = 0, dy = 0;
    if (Input.keys['ArrowLeft'] || Input.keys['KeyA']) dx -= 1;
    if (Input.keys['ArrowRight'] || Input.keys['KeyD']) dx += 1;
    if (Input.keys['ArrowUp'] || Input.keys['KeyW']) dy -= 1;
    if (Input.keys['ArrowDown'] || Input.keys['KeyS']) dy += 1;
    if (dx !== 0 || dy !== 0) { Input.usingMouse = false; p.x += dx * p.speed * 60 * dt; p.y += dy * p.speed * 60 * dt; }
    else if (Input.touch.active) { Input.usingMouse = false; p.x += Input.touch.dx * p.speed * 60 * dt; p.y += Input.touch.dy * p.speed * 60 * dt; }
    else if (Input.usingMouse) { p.x += (Input.mouseX - p.x) * 0.25; p.y += (Input.mouseY - p.y) * 0.25; }
    p.x = clamp(p.x, 26, W-26); p.y = clamp(p.y, 60, H-30);
    const wantShoot = Input.keys['Space'] || Input.shoot; if (wantShoot) playerShoot();
    p.fireCd -= dt;
    if (Input.keydown['Digit1']) useSkill(0); if (Input.keydown['Digit2']) useSkill(1);
    if (Input.keydown['Digit3']) useSkill(2); if (Input.keydown['Digit4']) useSkill(3);
    for (let i = 0; i < 4; i++) p.skillCd[i] = Math.max(0, p.skillCd[i] - dt);
    p.shieldT = Math.max(0, p.shieldT - dt); p.powerT = Math.max(0, p.powerT - dt);
    p.invincible = Math.max(0, p.invincible - dt); p.flashT = Math.max(0, p.flashT - dt);
}

function hurtPlayer(dmg, srcX, srcY) {
    const p = player; if (!p.alive || p.invincible > 0 || invincibleMode) return;
    p.hp -= dmg; p.flashT = 0.18; game.shake = Math.max(game.shake, 6);
    spawnParticles(p.x, p.y, 10, ['#ff5252','#ff8a80','#fff'], 3.5, 0.5); Audio.playerHurt();
    if (p.hp <= 0) { p.hp = 0; p.alive = false; bigExplosion(p.x, p.y, '#ff7b54'); Audio.playerDie(); game.state = GS.OVER; Audio.stopBGM(); Audio.gameover(); addScore(gameMode, game.score, game.wave); if (gameMode === 'normal' && game.score > game.best) { game.best = game.score; try{localStorage.setItem('acf_best', game.best);}catch(e){} } }
}

function updateBullets(dt) { for (const b of bullets) { b.y += b.vy * 60 * dt; b.x += (b.vx || 0) * 60 * dt; if (b.y < -20 || b.x < -20 || b.x > W+20) b.dead = true; } bullets = bullets.filter(b => !b.dead); }

function getDifficultyMult() {
    if (gameMode === 'invincible') return 0.6;
    const w = game.wave;
    if (w <= 2) return 0.7 + w * 0.1;
    if (w <= 5) return 0.9 + (w - 2) * 0.15;
    if (w <= 10) return 1.35 + (w - 5) * 0.2;
    return 2.35 + (w - 10) * 0.25;
}

function spawnEnemy(type, waveBoost) {
    const t = enemyTypes[type]; const mult = getDifficultyMult();
    enemies.push({ type, x: rand(30, W-30), y: -30, hp: Math.round(t.hp * mult), maxHp: Math.round(t.hp * mult), r: t.r, score: t.score, speed: t.speed * (1 + Math.random()*0.3 + waveBoost * 0.1), color: t.color, fireCd: rand(0.5, 1.5), fireRate: t.fire * (1 + waveBoost * 0.15), dead: false, movePhase: rand(0, Math.PI*2), dir: Math.random() < 0.5 ? -1 : 1 });
}

function drawEnemy(e) {
    ctx.save(); ctx.translate(e.x, e.y); const wob = Math.sin(game.time*6 + e.movePhase) * 0.06; ctx.rotate(wob);
    const g = ctx.createRadialGradient(0,0,2, 0,0,e.r); g.addColorStop(0, '#ffffff'); g.addColorStop(0.4, e.color); g.addColorStop(1, '#3a1020');
    ctx.beginPath();
    if (e.type === 'grunt' || e.type === 'fast') { ctx.moveTo(0, -e.r); ctx.quadraticCurveTo(e.r, 0, 0, e.r); ctx.quadraticCurveTo(-e.r, 0, 0, -e.r); }
    else if (e.type === 'tank') { ctx.moveTo(-e.r, -e.r*0.7); ctx.lineTo(e.r, -e.r*0.7); ctx.lineTo(e.r*1.2, 0); ctx.lineTo(e.r, e.r*0.7); ctx.lineTo(-e.r, e.r*0.7); ctx.lineTo(-e.r*1.2, 0); ctx.closePath(); }
    else { ctx.moveTo(0, -e.r); ctx.quadraticCurveTo(e.r*1.4, -e.r*0.4, e.r*0.6, e.r*0.5); ctx.lineTo(e.r*1.1, e.r); ctx.lineTo(-e.r*1.1, e.r); ctx.lineTo(-e.r*0.6, e.r*0.5); ctx.quadraticCurveTo(-e.r*1.4, -e.r*0.4, 0, -e.r); ctx.closePath(); }
    ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1; ctx.stroke();
    if (e.hp < e.maxHp) { ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(-e.r, -e.r-10, e.r*2, 4); ctx.fillStyle = '#ffd166'; ctx.fillRect(-e.r, -e.r-10, e.r*2 * (e.hp/e.maxHp), 4); }

function updateEnemies(dt) { for (const e of enemies) { e.movePhase += dt * 2; e.y += e.speed * 60 * dt; if (e.type === 'fast') e.x += Math.sin(e.movePhase*1.5) * 1.2; else if (e.type === 'tank') e.x += Math.sin(e.movePhase) * 0.6; else e.x += e.dir * Math.sin(e.movePhase) * 0.8; e.fireCd -= dt; if (e.fireCd <= 0 && e.y > 20 && e.y < H-120) { e.fireCd = e.fireRate * rand(0.8, 1.3); fireEnemyBullet(e); } if (e.y > H + 40) e.dead = true; } enemies = enemies.filter(e => !e.dead); }

function fireEnemyBullet(e) {
    const p = player; const speed = 3.4 + game.wave * 0.15; const ang = Math.atan2(p.y - e.y, p.x - e.x);
    const spread = e.type === 'tank' ? [-0.28, 0, 0.28] : [0];
    for (const off of spread) { const a = ang + off; ebullets.push({ x: e.x, y: e.y + e.r*0.5, r: e.type === 'tank' ? 7 : 5, vx: Math.cos(a)*speed, vy: Math.sin(a)*speed, dmg: e.type === 'tank' ? 18 : 10, dead: false, color: e.color }); }
    Audio.tone(300, 0.08, 'triangle', 0.05, 150);
}

function updateEBullets(dt) { for (const b of ebullets) { b.x += b.vx * 60 * dt; b.y += b.vy * 60 * dt; if (b.y > H+20 || b.y < -20 || b.x < -20 || b.x > W+20) b.dead = true; } ebullets = ebullets.filter(b => !b.dead); }

const bossForms = [
    { name: '突击型', color1: '#8f9bff', color2: '#5c2fc0', color3: '#1b0b3a', hpMult: 1, patterns: [0, 1, 2] },
    { name: '防御型', color1: '#4fc3f7', color2: '#0277bd', color3: '#01579b', hpMult: 1.5, patterns: [1, 2, 0] },
    { name: '狂暴型', color1: '#ff5252', color2: '#c62828', color3: '#b71c1c', hpMult: 1.2, patterns: [2, 0, 1] },
    { name: '终极型', color1: '#ffd700', color2: '#ff8f00', color3: '#e65100', hpMult: 2, patterns: [0, 1, 2, 0] },
];

function getBossForm() {
    const w = game.wave;
    if (w <= 4) return bossForms[0];
    if (w <= 8) return bossForms[1];
    if (w <= 12) return bossForms[2];
    return bossForms[3];
}

function spawnBoss() {
    const form = getBossForm();
    boss = { x: W/2, y: -60, targetY: 110, hp: Math.round((160 + game.wave * 30) * form.hpMult), maxHp: Math.round((160 + game.wave * 30) * form.hpMult), r: 60, state: 'enter', t: 0, phase: 0, fireCd: 2, moveT: 0, dead: false, flashT: 0, form };
    Audio.bossRoar(); game.shake = Math.max(game.shake, 10); showBanner(' BOSS: ' + form.name + ' ');
}

function updateBoss(dt) {
    if (!boss) return; const b = boss; b.t += dt; b.flashT = Math.max(0, b.flashT - dt);
    if (b.state === 'enter') { b.y += (b.targetY - b.y) * 0.03; if (b.y > b.targetY - 2) b.state = 'fight'; }
    else {
        b.moveT += dt; b.x = W/2 + Math.sin(b.moveT * 0.6) * (W/2 - 90);
        const ang = Math.atan2(player.y - b.y, player.x - b.x); b.fireCd -= dt;
        const patterns = b.form.patterns;
        if (b.fireCd <= 0) {
            b.phase = (b.phase + 1) % patterns.length;
            const p = patterns[b.phase];
            if (p === 0) { for (let i = -6; i <= 6; i++) { const a = ang + i * 0.09; ebullets.push({ x: b.x, y: b.y + 40, r: 6, vx: Math.cos(a)*4.2, vy: Math.sin(a)*4.2, dmg: 12, dead:false, color:'#ff5252' }); } Audio.bossRoar(); b.fireCd = 1.6; }
            else if (p === 1) { for (let i = 0; i < 14; i++) { const a = b.t * 1.6 + (i * Math.PI*2/14); ebullets.push({ x: b.x, y: b.y + 20, r: 5, vx: Math.cos(a)*3.2, vy: Math.sin(a)*3.2, dmg: 10, dead:false, color:'#ffd166' }); } b.fireCd = 0.5; }
            else { for (let i = 0; i < 3; i++) { setTimeout(()=>{ if (!boss) return; const a2 = Math.atan2(player.y - b.y, player.x - b.x) + (i-1)*0.05; ebullets.push({ x: boss.x, y: boss.y + 40, r: 7, vx: Math.cos(a2)*5, vy: Math.sin(a2)*5, dmg: 15, dead:false, color:'#ba68c8' }); }, i*160); } b.fireCd = 1.1; }
        }
    }
    if (b.hp <= 0 && !b.dead) { b.dead = true; bigExplosion(b.x, b.y, '#ff9f43'); for (let i = 0; i < 6; i++) setTimeout(()=>{ bigExplosion(b.x+rand(-40,40), b.y+rand(-30,30), '#ffd166'); }, i*120); game.score += 2000; game.shake = 18; Audio.bigExplode(); showBanner('BOSS 击破！ +2000'); dropPowerup(b.x, b.y); }
    if (b.dead && b.t > 1.5) boss = null;
}

function drawBoss() {
    if (!boss) return; const b = boss; const f = b.form;
    ctx.save(); ctx.translate(b.x, b.y); if (b.flashT > 0) { ctx.globalAlpha = 0.5; ctx.globalCompositeOperation = 'lighter'; }
    const g = ctx.createRadialGradient(0,-10,10, 0,0,80); g.addColorStop(0, f.color1); g.addColorStop(0.5, f.color2); g.addColorStop(1, f.color3);
    ctx.beginPath(); ctx.moveTo(0, -55); ctx.quadraticCurveTo(55, -30, 70, 20); ctx.lineTo(45, 55); ctx.lineTo(0, 40); ctx.lineTo(-45, 55); ctx.lineTo(-70, 20); ctx.quadraticCurveTo(-55, -30, 0, -55); ctx.closePath();
    ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = 'rgba(160,170,255,0.9)'; ctx.lineWidth = 2; ctx.stroke();
    const pulse = 0.7 + Math.sin(game.time*5)*0.3; ctx.beginPath(); ctx.arc(0, 0, 16*pulse, 0, Math.PI*2); ctx.fillStyle = '#ffd166'; ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI*2); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.fillStyle = '#2a1a5c'; ctx.fillRect(-68, 15, 10, 30); ctx.fillRect(58, 15, 10, 30);
    ctx.strokeStyle = 'rgba(255,209,102,0.8)'; ctx.lineWidth = 2; ctx.strokeRect(-68, 15, 10, 30); ctx.strokeRect(58, 15, 10, 30);
    ctx.restore();
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(30, 26, W-60, 14);
    const grad = ctx.createLinearGradient(30,0,W-30,0); grad.addColorStop(0, '#ff5252'); grad.addColorStop(1, '#ffd166');
    ctx.fillStyle = grad; ctx.fillRect(30, 26, (W-60) * (b.hp / b.maxHp), 14);
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.strokeRect(30, 26, W-60, 14);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 11px "Microsoft YaHei"'; ctx.textAlign = 'center';
    ctx.fillText(f.name + ' BOSS ' + Math.max(0, Math.ceil(b.hp)), W/2, 20);
}

function dropPowerup(x, y) { if (Math.random() < 0.16) powerups.push({ x, y, r: 10, vy: 1.4, kind: Math.random()<0.5?'heal':'power', t:0, dead:false }); }
function updatePowerups(dt) { for (const pu of powerups) { pu.y += pu.vy * 60 * dt; pu.t += dt; if (pu.y > H + 20) pu.dead = true; } powerups = powerups.filter(p => !p.dead); }
function drawPowerup(pu) { ctx.save(); ctx.translate(pu.x, pu.y); ctx.rotate(pu.t * 2); const c = pu.kind === 'heal' ? '#69f0ae' : '#ffd166'; ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fill(); ctx.strokeStyle = c; ctx.lineWidth = 2; ctx.stroke(); ctx.font = 'bold 13px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle = c; ctx.fillText(pu.kind === 'heal' ? '+♥' : '★', 0, 1); ctx.restore(); }

function bigExplosion(x, y, color) { spawnParticles(x, y, 30, [color, '#fff', '#ffd166'], 6, 0.9); spawnRing(x, y, color, 20, 7, 0.5); spawnParticles(x, y, 8, ['#555','#888'], 2, 1.2); Audio.explode(); }

let banner = null;
function showBanner(text) { banner = { text, t: 2.2 }; }
function drawBanner() { if (!banner) return; banner.t -= 1/60; if (banner.t <= 0) { banner = null; return; } const a = clamp(banner.t / 0.5, 0, 1); ctx.globalAlpha = a * (banner.t < 0.4 ? banner.t/0.4 : 1); ctx.font = 'bold 30px "Microsoft YaHei"'; ctx.textAlign = 'center'; ctx.shadowColor = '#ff5252'; ctx.shadowBlur = 24; ctx.fillStyle = '#fff'; ctx.fillText(banner.text, W/2, H/2 - 60); ctx.shadowBlur = 0; ctx.globalAlpha = 1; }

const easterEggThresholds = [1000, 3000, 5000, 10000, 20000, 50000];
let triggeredEasterEggs = new Set();
function checkEasterEggs() {
    for (const threshold of easterEggThresholds) {
        if (game.score >= threshold && !triggeredEasterEggs.has(threshold)) {
            triggeredEasterEggs.add(threshold);
            game.flash = 0.6; game.flashColor = '255,215,0'; game.shake = 12;
            spawnRing(W/2, H/2, '#ffd700', 60, 10, 1.0);
            spawnParticles(W/2, H/2, 50, ['#ffd700','#ff6b6b','#69f0ae','#4fc3f7','#fff'], 8, 1.2);
            Audio.easterEgg();
            showBanner(' 彩蛋！得分突破 ' + threshold + ' ！');
            game.score += Math.round(threshold * 0.1);
        }
    }
}

function handleCollisions() {
    const p = player;
    for (const b of bullets) {
        if (b.dead) continue;
        if (boss) { if (dist(b.x, b.y, boss.x, boss.y) < boss.r + 6) { boss.hp -= b.dmg; boss.flashT = 0.06; spawnParticles(b.x, b.y, 4, ['#ffd166','#fff'], 2.5, 0.35); Audio.hit(); if (!b.pierce) b.dead = true; continue; } }
        for (const e of enemies) { if (e.dead) continue; if (dist(b.x, b.y, e.x, e.y) < e.r + 5) { e.hp -= b.dmg; spawnParticles(b.x, b.y, 4, [e.color, '#fff'], 2, 0.3); Audio.hit(); if (!b.pierce) { b.dead = true; break; } } }
    }
    for (const e of enemies) { if (e.hp <= 0 && !e.dead) { e.dead = true; game.kills++; game.combo++; game.comboMax = Math.max(game.comboMax, game.combo); game.score += e.score * (1 + Math.min(game.combo, 10) * 0.1); bigExplosion(e.x, e.y, e.color); game.shake = Math.max(game.shake, e.type==='tank' ? 8 : 4); dropPowerup(e.x, e.y); if (game.kills % 8 === 0) Audio.levelup(); } }
    enemies = enemies.filter(e => !e.dead);
    for (const b of ebullets) { if (b.dead) continue; if (dist(b.x, b.y, p.x, p.y) < 18 + b.r) { b.dead = true; if (p.shieldT > 0 || invincibleMode) { if (invincibleMode) spawnRing(b.x, b.y, '#ffd700', 10, 3, 0.4); else spawnRing(b.x, b.y, '#69f0ff', 10, 3, 0.4); Audio.tone(500,0.08,'square',0.1,300); } else hurtPlayer(b.dmg, b.x, b.y); } }
    ebullets = ebullets.filter(b => !b.dead);
    for (const e of enemies) { if (e.dead) continue; if (dist(e.x, e.y, p.x, p.y) < e.r + 16) { if (p.shieldT > 0 || invincibleMode) { e.hp = 0; e.dead = true; bigExplosion(e.x, e.y, e.color); if (invincibleMode) game.score += 5; } else { e.dead = true; bigExplosion(e.x, e.y, e.color); hurtPlayer(25, e.x, e.y); } } }
    enemies = enemies.filter(e => !e.dead);
    if (boss && !boss.dead) { if (dist(boss.x, boss.y, p.x, p.y) < boss.r + 16) { if (p.shieldT <= 0 && !invincibleMode) hurtPlayer(30, boss.x, boss.y); } }
    for (const pu of powerups) { if (pu.dead) continue; if (dist(pu.x, pu.y, p.x, p.y) < 26) { pu.dead = true; if (pu.kind === 'heal') { p.hp = Math.min(p.maxHp, p.hp + 25); spawnParticles(p.x, p.y, 12, ['#69f0ae','#fff'], 2.5, 0.6); Audio.tone(700,0.15,'sine',0.15,900); } else { p.powerT = Math.max(p.powerT, 5); spawnParticles(p.x, p.y, 12, ['#ffd166','#fff'], 2.5, 0.6); Audio.power(); } } }
    powerups = powerups.filter(pu => !pu.dead);
    checkEasterEggs();
}

function updateSpawning(dt) {
    if (!boss && !game.bossDone && game.wave > 1 && game.wave % 2 === 0) { if (enemies.length === 0) { spawnBoss(); return; } }
    if (boss && boss.dead) game.bossDone = true;
    game.spawnTimer -= dt;
    if (game.spawnTimer <= 0) {
        const waveBoost = (game.wave - 1) * 0.18; const roll = Math.random();
        if (roll < 0.45) spawnEnemy('grunt', waveBoost);
        else if (roll < 0.7) spawnEnemy('fast', waveBoost);
        else if (roll < 0.88) spawnEnemy('bomber', waveBoost);
        else spawnEnemy('tank', waveBoost);
        game.spawnTimer = Math.max(0.45, 1.25 - game.wave * 0.06 - Math.random()*0.3);
    }
}

function checkWaveProgress() { const perWave = 8 + game.wave * 2; if (game.kills >= perWave) { game.kills = 0; game.wave++; game.bossDone = false; Audio.levelup(); showBanner('第 ' + game.wave + ' 波'); } }
function updateParticles(dt) { for (const pt of particles) { pt.x += pt.vx * 60 * dt; pt.y += pt.vy * 60 * dt; pt.vx *= pt.drag; pt.vy *= pt.drag; pt.life -= dt; } particles = particles.filter(pt => pt.life > 0); }
function updateStars(dt) { const sp = (game.state === GS.PLAY) ? 1 : 0.4; for (const s of stars) { s.y += s.z * 30 * sp * dt; if (s.y > H) { s.y = -2; s.x = rand(0, W); } } }

function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#030515'); g.addColorStop(0.5, '#070b24'); g.addColorStop(1, '#0a0618');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const neb = ctx.createRadialGradient(W*0.8, H*0.25, 0, W*0.8, H*0.25, 200); neb.addColorStop(0, 'rgba(90,60,200,0.12)'); neb.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = neb; ctx.fillRect(0,0,W,H);
    const neb2 = ctx.createRadialGradient(W*0.15, H*0.7, 0, W*0.15, H*0.7, 220); neb2.addColorStop(0, 'rgba(30,120,200,0.10)'); neb2.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = neb2; ctx.fillRect(0,0,W,H);
    for (const s of stars) { ctx.globalAlpha = 0.4 + s.z * 0.6 + Math.sin(s.tw + game.time*2) * 0.15; ctx.fillStyle = s.z > 0.7 ? '#dce6ff' : '#8fa3d9'; ctx.fillRect(s.x, s.y, s.s, s.s); }
    ctx.globalAlpha = 1;
}

function drawParticles() { for (const pt of particles) { const a = clamp(pt.life / pt.max, 0, 1); ctx.globalAlpha = a; ctx.fillStyle = pt.color; ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size * (0.5 + a*0.5), 0, Math.PI*2); ctx.fill(); } ctx.globalAlpha = 1; }

function drawHUD() {

        ctx.fillStyle = ready ? s.color : '#5a6a95'; ctx.font = 'bold 9px "Microsoft YaHei"'; ctx.textAlign = 'center'; ctx.fillText(s.key + ' ' + s.name, x + size/2, y + size - 3);
    }

function drawSkillIcon(ki, bx, by, size, color) {
    const cx = bx + size / 2, cy = by + size / 2 - 5, s = size * 0.32;
    ctx.fillStyle = color; ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.lineJoin = 'round';
    if (ki === 0) { ctx.beginPath(); ctx.moveTo(cx, cy - s * 1.1); ctx.quadraticCurveTo(cx + s, cy - s * 1.1, cx + s * 0.95, cy - s * 0.35); ctx.quadraticCurveTo(cx + s * 0.85, cy + s * 0.9, cx, cy + s * 1.25); ctx.quadraticCurveTo(cx - s * 0.85, cy + s * 0.9, cx - s * 0.95, cy - s * 0.35); ctx.quadraticCurveTo(cx - s, cy - s * 1.1, cx, cy - s * 1.1); ctx.closePath(); ctx.fill(); }
    else if (ki === 1) { ctx.beginPath(); ctx.arc(cx, cy + s * 0.1, s * 0.72, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = color; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.moveTo(cx + s * 0.3, cy - s * 0.5); ctx.quadraticCurveTo(cx + s * 0.7, cy - s * 1.0, cx + s * 0.35, cy - s * 1.35); ctx.stroke(); ctx.fillStyle = '#ff5f5f'; ctx.beginPath(); ctx.arc(cx + s * 0.35, cy - s * 1.45, s * 0.22, 0, Math.PI * 2); ctx.fill(); }
    else if (ki === 2) { ctx.beginPath(); ctx.moveTo(cx, cy - s * 1.2); ctx.lineTo(cx + s * 0.28, cy - s * 0.3); ctx.lineTo(cx + s * 1.05, cy - s * 0.35); ctx.lineTo(cx + s * 0.45, cy + s * 0.2); ctx.lineTo(cx + s * 0.6, cy + s * 0.95); ctx.lineTo(cx, cy + s * 0.5); ctx.lineTo(cx - s * 0.6, cy + s * 0.95); ctx.lineTo(cx - s * 0.45, cy + s * 0.2); ctx.lineTo(cx - s * 1.05, cy - s * 0.35); ctx.lineTo(cx - s * 0.28, cy - s * 0.3); ctx.closePath(); ctx.fill(); }
    else { ctx.beginPath(); ctx.arc(cx, cy, s * 0.8, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = 'rgba(10,16,40,0.5)'; ctx.font = 'bold ' + (s * 1.2) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('+', cx, cy + 1); }
}

function rr(x, y, w, h, r) { if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); return; } ctx.rect(x, y, w, h); }

    ctx.font = 'bold 44px "Microsoft YaHei"';
    const grad = ctx.createLinearGradient(0,-40,0,20); grad.addColorStop(0, '#fff'); grad.addColorStop(0.5, '#9fe7ff'); grad.addColorStop(1, '#4fc3f7');

    const isTouch = window.matchMedia && matchMedia('(pointer:coarse)').matches;

    ctx.fillStyle = 'rgba(180,120,20,0.35)'; ctx.strokeStyle = 'rgba(255,200,60,0.7)';

    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(20,40,80,0.4)'; ctx.strokeStyle = 'rgba(100,160,255,0.4)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); rr(btn3X, btn3Y, btn3W, 36, 10); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#8fa3d9'; ctx.font = '13px "Microsoft YaHei"'; ctx.fillText(' 排行榜', btn3X + btn3W/2, btn3Y + 22);
    ctx.beginPath(); rr(btn4X, btn4Y, btn4W, 36, 10); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#8fa3d9'; ctx.fillText(' 反馈', btn4X + btn4W/2, btn4Y + 22);
    ctx.font = '12px "Microsoft YaHei"'; ctx.fillStyle = '#6a7bb8';
    const moveHint = isTouch ? '左摇杆移动 · 右侧射击键开火' : '方向键 / WASD / 鼠标移动 · 空格或鼠标射击';
    ctx.fillText(moveHint, W/2, H - 80);

    const invBest = leaderboard.invincible.length > 0 ? leaderboard.invincible[0].score : 0;
    if (game.best > 0 || invBest > 0) { ctx.font = 'bold 13px "Microsoft YaHei"'; ctx.fillStyle = '#ffd166'; ctx.fillText('普通最高：' + game.best + '  无敌最高：' + invBest, W/2, 80); }

function drawGameOver() {
    ctx.fillStyle = 'rgba(2,3,12,0.72)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.font = 'bold 52px "Microsoft YaHei"'; ctx.fillStyle = '#ff5252'; ctx.shadowColor = '#ff5252'; ctx.shadowBlur = 26;
    ctx.fillText('战败', W/2, H/2 - 100); ctx.shadowBlur = 0;
    if (gameMode === 'invincible') { ctx.font = 'bold 16px "Microsoft YaHei"'; ctx.fillStyle = '#ffd166'; ctx.fillText('（无敌模式）', W/2, H/2 - 65); }
    ctx.font = 'bold 24px "Microsoft YaHei"'; ctx.fillStyle = '#fff'; ctx.fillText('最终得分 ' + game.score, W/2, H/2 - 30);
    const isNew = gameMode === 'normal' && game.score >= game.best && game.score > 0;
    ctx.font = '15px "Microsoft YaHei"'; ctx.fillStyle = isNew ? '#69f0ae' : '#9fb3ff';
    ctx.fillText((isNew ? '🎉 新纪录！ ' : '最高 ') + game.best, W/2, H/2 + 4);
    const lbEntry = leaderboard[gameMode] ? leaderboard[gameMode].findIndex(s => s.score === game.score) : -1;
    if (lbEntry >= 0) { ctx.font = 'bold 14px "Microsoft YaHei"'; ctx.fillStyle = '#ffd166'; ctx.fillText('排行榜第 ' + (lbEntry + 1) + ' 名', W/2, H/2 + 30); }
    ctx.font = 'bold 18px "Microsoft YaHei"'; ctx.fillStyle = '#ffd166';
    const blink = 0.6 + Math.sin(game.time*3)*0.4; ctx.globalAlpha = clamp(blink, 0.3, 1);
    const isTouch = window.matchMedia && matchMedia('(pointer:coarse)').matches;
    ctx.fillText(isTouch ? '点击屏幕 返回菜单' : '按 Enter 返回菜单', W/2, H/2 + 70); ctx.globalAlpha = 1;
}

function drawPause() { ctx.fillStyle = 'rgba(2,3,12,0.6)'; ctx.fillRect(0,0,W,H); ctx.textAlign = 'center'; ctx.font = 'bold 40px "Microsoft YaHei"'; ctx.fillStyle = '#fff'; ctx.fillText('已暂停', W/2, H/2 - 20); ctx.font = '15px "Microsoft YaHei"'; ctx.fillStyle = '#9fb3ff'; ctx.fillText('按 P 继续', W/2, H/2 + 24); }

let lastT = 0;
function frame(ts) {
    const dt = clamp((ts - lastT) / 1000, 0, 0.05); lastT = ts;
    if (game.state === GS.MENU) {
        if (Input.keydown['Digit1']) { gameMode = 'normal'; startGame('normal'); }
        if (Input.keydown['Digit2']) { gameMode = 'invincible'; startGame('invincible'); }
        if (Input.keydown['KeyL'] || Input.keydown['Tab']) { showLeaderboard(); Input.keydown = {}; Input.keyup = {}; requestAnimationFrame(frame); return; }
    }
    if (Input.keydown['Enter'] || Input.keydown['Space']) {
        if (game.state === GS.MENU) { gameMode = 'normal'; startGame('normal'); }
        else if (game.state === GS.OVER) { game.state = GS.MENU; }
    }
    if (Input.keydown['Escape'] && game.state === GS.PLAY) { game.state = GS.MENU; Audio.stopBGM(); }
    if (Input.tapStart && (game.state === GS.MENU || game.state === GS.OVER)) {
        if (game.state === GS.MENU) { gameMode = 'normal'; startGame('normal'); }
        else { game.state = GS.MENU; }
    }
    Input.tapStart = false;
    if (Input.keydown['KeyP'] && game.state === GS.PLAY) game.state = GS.PAUSE;
    else if (Input.keydown['KeyP'] && game.state === GS.PAUSE) game.state = GS.PLAY;
    if (Input.keydown['KeyM']) Audio.toggleMute();
    if (Input.keydown['KeyF'] && game.state === GS.PLAY) { showFeedback(); Input.keydown = {}; }
    if (Input.keydown['ControlLeft'] && Input.keydown['ShiftLeft'] && Input.keydown['KeyA']) { showAdmin(); Input.keydown = {}; }
    game.time += dt; updateStars(dt); updateParticles(dt);
    if (game.state === GS.PLAY) { updatePlayer(dt); updateBullets(dt); updateEnemies(dt); updateEBullets(dt); if (boss) updateBoss(dt); updatePowerups(dt); updateSpawning(dt); checkWaveProgress(); handleCollisions(); }
    ctx.clearRect(0,0,W,H);
    if (game.state === GS.MENU) { drawMenu(); }
    else {
        drawBackground(); ctx.save();
        if (game.shake > 0.1) { ctx.translate(rand(-game.shake, game.shake)*0.5, rand(-game.shake, game.shake)*0.5); game.shake *= 0.88; }
        powerups.forEach(drawPowerup); for (const e of enemies) drawEnemy(e); if (boss) drawBoss(); drawPlayer();
        for (const b of bullets) { ctx.save(); ctx.fillStyle = b.color; ctx.shadowColor = b.color; ctx.shadowBlur = 8; ctx.fillRect(b.x-3, b.y-7, 6, 14); ctx.restore(); }
        for (const b of ebullets) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fillStyle = b.color; ctx.shadowColor = b.color; ctx.shadowBlur = 10; ctx.fill(); ctx.shadowBlur = 0; ctx.beginPath(); ctx.arc(b.x, b.y, b.r*0.5, 0, Math.PI*2); ctx.fillStyle = '#fff'; ctx.fill(); }
        drawParticles(); ctx.restore();
        if (game.flash > 0) { ctx.fillStyle = 'rgba(' + game.flashColor + ',' + (game.flash*0.8) + ')'; ctx.fillRect(0,0,W,H); game.flash -= dt; }
        drawHUD(); drawBanner();
        if (game.state === GS.PAUSE) drawPause();
        if (game.state === GS.OVER) drawGameOver();
    }
    Input.keydown = {}; Input.keyup = {};
    requestAnimationFrame(frame);
}

function startGame(mode) { if (mode) gameMode = mode; resetGame(); game.state = GS.PLAY; Audio.unlock(); Audio.startBGM(); triggeredEasterEggs = new Set(); }
const resetPlayer = () => { Object.assign(player, { x: W/2, y: H-130, hp: 100, fireCd: 0, invincible: 2, shieldT: 0, powerT: 0, skillCd: [0,0,0,0], flashT: 0, alive: true }); };
const resetGame = () => { bullets = []; enemies = []; ebullets = []; particles = []; powerups = []; boss = null; game.score = 0; game.wave = 1; game.time = 0; game.shake = 0; game.spawnTimer = 1.2; game.bossTimer = 0; game.combo = 0; game.comboMax = 0; game.kills = 0; game.flash = 0; invincibleMode = (gameMode === 'invincible'); $('invincible-hud').classList.toggle('visible', invincibleMode); resetPlayer(); };

function handleMenuClick(e) { const r = canvas.getBoundingClientRect(); const mx = (e.clientX - r.left) / r.width * W; const my = (e.clientY - r.top) / r.height * H; for (const btn of menuButtons) { if (mx >= btn.x && mx <= btn.x + btn.w && my >= btn.y && my <= btn.y + btn.h) { if (btn.action === 'leaderboard') showLeaderboard(); else if (btn.action === 'feedback') showFeedback(); else { gameMode = btn.action; startGame(btn.action); } return; } } }

function showLeaderboard() { const panel = $('leaderboard-panel'); panel.classList.add('visible'); renderLeaderboard('normal'); document.querySelectorAll('.lb-tab').forEach(tab => { tab.classList.toggle('active', tab.dataset.mode === 'normal'); tab.onclick = () => { document.querySelectorAll('.lb-tab').forEach(t => t.classList.remove('active')); tab.classList.add('active'); renderLeaderboard(tab.dataset.mode); }; }); }
$('lb-close').addEventListener('click', () => { $('leaderboard-panel').classList.remove('visible'); });

function showFeedback() { $('feedback-panel').classList.add('visible'); $('fb-success').style.display = 'none'; $('fb-textarea').value = ''; }
$('fb-close').addEventListener('click', () => { $('feedback-panel').classList.remove('visible'); });
$('fb-submit').addEventListener('click', () => { const text = $('fb-textarea').value.trim(); if (!text) return; addFeedback(text); $('fb-success').style.display = 'block'; setTimeout(() => { $('feedback-panel').classList.remove('visible'); }, 1500); });

function showAdmin() { const panel = $('admin-panel'); panel.classList.add('visible'); const list = $('admin-list'); if (feedbackList.length === 0) { list.innerHTML = '<div class="admin-item" style="text-align:center;color:#5a6a95;">暂无反馈</div>'; return; } list.innerHTML = feedbackList.slice().reverse().map(fb => { const d = new Date(fb.time); const timeStr = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); return `<div class="admin-item"><span class="fb-name">${fb.name || '匿名'}</span> <span class="fb-time">${timeStr}</span><div class="fb-text">${fb.text}</div></div>`; }).join(''); }
$('admin-close').addEventListener('click', () => { $('admin-panel').classList.remove('visible'); });
$('admin-export').addEventListener('click', () => { const data = JSON.stringify(feedbackList, null, 2); const blob = new Blob([data], { type: 'application/json' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'feedback_' + Date.now() + '.json'; a.click(); URL.revokeObjectURL(url); });

try { game.best = parseInt(localStorage.getItem('acf_best') || '0', 10) || 0; } catch(e) {}
window.addEventListener('pointerdown', () => Audio.unlock(), {once:false});
requestAnimationFrame(frame);
</script>
